<ion-header>
  <ion-toolbar>
    <ion-title align="center">Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="p-8 flex flex-col gap-4">
    <div
      class="group w-full flex h-min ring-none items-center justify-center rounded-lg py-2 px-4 font-dm !ring-transparent text-white border bg-[#ff6e6c]"
    >
      <span class="text-xl">{{ email }}</span>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div
        class="col-span-2 flex relative rounded-lg shadow-md bg-gradient-to-b from-yellow-100 from-5% to-yellow-300"
      >
        <img
          src="https://i.postimg.cc/bJ217LJ6/design-de-layout-de-linhas-de-grade-de-perspectiva-curva-abstrata-removebg-preview.png"
          alt=""
          class="opacity-40 w-1/2 brightness-150 object-contain"
          width="816"
          height="440"
        />
        <img
          src="https://i.postimg.cc/bJ217LJ6/design-de-layout-de-linhas-de-grade-de-perspectiva-curva-abstrata-removebg-preview.png"
          alt=""
          class="opacity-20 w-1/2 brightness-150 object-contain"
          width="816"
          height="440"
        />

        <span
          class="absolute top-1/2 text-center left-1/2 text-neutral-500 font-bold text-xl -translate-x-1/2 -translate-y-1/2"
        >
          <span class="text-2xl mb-2">Tarefas</span> <br />
          {{totalTasks}}
        </span>
      </div>

      <div
        class="col-span-1 relative rounded-lg shadow-md bg-gradient-to-b from-green-100 from-5% to-green-400"
      >
        <img
          src="https://i.postimg.cc/bJ217LJ6/design-de-layout-de-linhas-de-grade-de-perspectiva-curva-abstrata-removebg-preview.png"
          alt=""
          class="opacity-20 w-full brightness-150 object-cover"
          width="816"
          height="440"
        />

        <span
          class="absolute flex items-center justify-between gap-6 top-1/2 left-1/2 text-neutral-500 font-bold -translate-x-1/2 -translate-y-1/2"
        >
          <span class="text-md mb-2">Tarefas Feitas</span> <br />
          <span class="text-2xl">{{doneTasks}}</span>
        </span>
      </div>

      <div
        class="col-span-1 relative rounded-lg shadow-md bg-gradient-to-b from-red-100 from-5% to-red-400"
      >
        <img
          src="https://i.postimg.cc/bJ217LJ6/design-de-layout-de-linhas-de-grade-de-perspectiva-curva-abstrata-removebg-preview.png"
          alt=""
          class="opacity-20 w-full brightness-150 object-cover"
          width="816"
          height="440"
        />

        <span
          class="absolute flex items-center justify-between gap-6 top-1/2 left-1/2 text-neutral-500 font-bold -translate-x-1/2 -translate-y-1/2"
        >
          <span class="text-md mb-2">Tarefas Pendentes</span> <br />
          <span class="text-2xl">{{notDoneTasks}}</span>
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <!-- <button
        class="group w-full flex h-min ring-none items-center justify-center rounded-lg py-2 px-4 font-dm !ring-transparent text-[#ff6e6c] border border-[#ff6e6c] border-b-[#f18583] border-b-4"
        (click)="changeEmail()"
      >
        Alterar Email
      </button> -->

      <button
        class="group w-full flex h-min ring-none items-center justify-center rounded-lg py-2 px-4 font-dm !ring-transparent text-[#ff6e6c] border border-[#ff6e6c] border-b-[#f18583] border-b-4"
        (click)="changePassword()"
      >
        Alterar Senha
      </button>
    </div>
  </div>
</ion-content>

<div
  class="flex flex-col justify-between h-full bg-white py-10 text-neutral-700"
>
  <h1 class="text-4xl font-bold text-center mb-6">Lista de Tarefas</h1>

  <div class="p-4 h-full flex flex-col gap-4 overflow-x-auto">
    <div
      class="flex flex-col w-full justify-between"
      *ngFor="let task of groupedTasks"
    >
      <div class="flex items-center justify-center gap-2 mb-6">
        <div class="size-2 rounded-full bg-[#ff6e6c]"></div>

        <h2 class="text-[#1f1235] font-bold">{{ task.data }}</h2>

        <div class="size-2 rounded-full bg-[#ff6e6c]"></div>
      </div>

      <ion-item-sliding
        class="flex flex-col my-2"
        *ngFor="let item of task.tasks"
      >
        <ion-item class="w-full bg-neutral-100 rounded-lg p-4">
          <ion-label class="text-[#1f1235] bg-transparent"
            >{{ item.title }}</ion-label
          >
        </ion-item>

        <ion-item-options>
          <ion-item-option (click)="editTask(item)" class="w-16" color="warning"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
              />
            </svg>
          </ion-item-option>
          <ion-item-option
            (click)="deleteTask(item.id)"
            color="danger"
            class="w-16 rounded-e-lg"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
              />
            </svg>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </div>
  </div>

  <ion-alert
    trigger="add-task"
    class="custom-alert"
    header="Nova Tarefa"
    message="Digite o título da nova tarefa"
    [inputs]="alertInputs"
    [buttons]="alertButtons"
  ></ion-alert>
</div>
